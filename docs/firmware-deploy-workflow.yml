# GitHub Actions를 이용한 ESP32-S3 Arduino 빌드 및 배포 + Mystic Lab 연동
#
# 새 장치 추가 시: /admin/firmware에 장치 추가 후 소스 코드 zip을 올립니다.
# 이 워크플로우는 자동으로 .ino 파일을 찾아 빌드합니다.
#
# 사전 준비:
#   1. 빌드 대상 장치 폴더 내에 .ino 파일이 존재해야 합니다.
#   2. GitHub Secrets에 다음 값을 추가해야 합니다:
#        FIRMWARE_CI_TOKEN : Vercel 배포에 사용되는 Mystic Lab API 토큰
# ============================================================

name: ESP32 Firmware Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "**/*.ino"
      - "**/*.h"
      - "**/*.cpp"
      - "**/*.c"

# 새 push가 들어오면 이전 실행을 취소하여 stale build가 DB에 덮어쓰여지지 않도록 방지
concurrency:
  group: firmware-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1단계: 리포지토리에서 .ino 파일 위치를 자동 감지하여 빌드 매트릭스 생성
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          DEVICES=$(find . -name "*.ino" -not -path "*/.git/*" \
            | xargs -I{} dirname {} \
            | sed 's|^\./||' \
            | sort -u \
            | jq -R . | jq -sc .)
          echo "matrix=$DEVICES" >> $GITHUB_OUTPUT
          echo "발견된 장치: $DEVICES"

  # 2단계: 장치별 병렬 빌드 및 배포
  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 board
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "U8g2"
          arduino-cli lib install "U8g2_for_Adafruit_GFX"
          if [ ! -d ~/Arduino/libraries/AsyncTCP ]; then
            git clone --depth 1 https://github.com/me-no-dev/AsyncTCP ~/Arduino/libraries/AsyncTCP
          fi
          if [ ! -d ~/Arduino/libraries/ESPAsyncWebServer ]; then
            git clone --depth 1 https://github.com/me-no-dev/ESPAsyncWebServer ~/Arduino/libraries/ESPAsyncWebServer
          fi

      - name: Extract version
        id: extract-version
        run: |
          DEVICE_DIR="${{ matrix.device }}"

          # config.h 또는 config_t.h에서 FIRMWARE_VERSION 추출
          # #define FIRMWARE_VERSION "x.x" 형식과 constexpr const char* FIRMWARE_VERSION = "x.x" 형식 모두 지원
          VERSION=""
          for CFG in "${DEVICE_DIR}/config.h" "${DEVICE_DIR}/config_t.h"; do
            if [ -f "$CFG" ]; then
              V=$(grep -oP '(?:#define\s+FIRMWARE_VERSION\s+"|constexpr\s+const\s+char\s*\*\s*FIRMWARE_VERSION\s*=\s*")\K[^"]+' "$CFG" || true)
              if [ -n "$V" ]; then VERSION="$V"; break; fi
            fi
          done

          # 버전을 감지하지 못하면 빌드 실패
          if [ -z "$VERSION" ]; then
            echo "::error::버전을 감지하지 못했습니다. ${DEVICE_DIR}/config.h 또는 config_t.h에 FIRMWARE_VERSION을 정의하세요."
            exit 1
          fi

          echo "감지된 버전: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: |
          mkdir -p build
          SKETCH=$(find ./${{ matrix.device }} -name "*.ino" | head -1)
          echo "컴파일 대상: $SKETCH (v${{ steps.extract-version.outputs.version }})"
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,PartitionScheme=min_spiffs" \
            "$SKETCH" \
            --output-dir ./build

      - name: Get signed upload URL
        id: get-url
        env:
          FIRMWARE_CI_TOKEN: ${{ secrets.FIRMWARE_CI_TOKEN }}
        run: |
          VERSION="${{ steps.extract-version.outputs.version }}"
          FILENAME="firmware-v${VERSION}.bin"
          RESPONSE=$(curl -sf -X POST \
            https://mystic-lab.vercel.app/api/admin/firmware/upload-url \
            -H "Authorization: Bearer ${FIRMWARE_CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"device_type\":\"${{ matrix.device }}\",\"version\":\"${VERSION}\",\"filename\":\"${FILENAME}\"}")
          echo "signed_url=$(echo "$RESPONSE" | jq -r '.signedUrl')" >> "$GITHUB_OUTPUT"
          echo "storage_path=$(echo "$RESPONSE" | jq -r '.storagePath')" >> "$GITHUB_OUTPUT"
          echo "public_url=$(echo "$RESPONSE" | jq -r '.publicUrl')" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload binary
        run: |
          BIN=$(find ./build -name "*.ino.bin" | head -1)
          echo "업로드 대상: $BIN ($(stat -c%s "$BIN") bytes)"
          curl -sf -X PUT "${{ steps.get-url.outputs.signed_url }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${BIN}"

      - name: Register release
        env:
          FIRMWARE_CI_TOKEN: ${{ secrets.FIRMWARE_CI_TOKEN }}
        run: |
          BIN=$(find ./build -name "*.ino.bin" | head -1)
          FILE_SIZE=$(stat -c%s "$BIN")
          MSG="${{ github.event.head_commit.message }}"
          curl -sf -X POST \
            https://mystic-lab.vercel.app/api/admin/firmware \
            -H "Authorization: Bearer ${FIRMWARE_CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"device_type\": \"${{ matrix.device }}\",
              \"version\": \"${{ steps.get-url.outputs.version }}\",
              \"download_url\": \"${{ steps.get-url.outputs.public_url }}\",
              \"storage_path\": \"${{ steps.get-url.outputs.storage_path }}\",
              \"file_size\": ${FILE_SIZE},
              \"notes\": \"${GITHUB_SHA:0:8}: ${MSG}\"
            }"
          echo "장치 ${{ matrix.device }} v${{ steps.get-url.outputs.version }} 배포 완료"