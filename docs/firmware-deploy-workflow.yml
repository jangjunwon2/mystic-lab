# ============================================================
# GitHub Actions — ESP32-S3 Arduino 자동 빌드 + Mystic Lab 배포
#
# 새 장치 추가 시: /admin/firmware에서 장치 추가 → 소스 폴더를 zip으로 올리면 끝.
# 이 워크플로우는 리포 안의 .ino 파일을 자동으로 찾아 모두 빌드합니다.
#
# 설정:
#   1. 이 파일을 펌웨어 리포의 .github/workflows/firmware-deploy.yml 로 복사
#   2. 펌웨어 리포 GitHub Secrets에 추가:
#        FIRMWARE_CI_TOKEN : Vercel의 FIRMWARE_CI_TOKEN과 동일한 값
# ============================================================

name: ESP32 Firmware Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "**/*.ino"
      - "**/*.h"
      - "**/*.cpp"
      - "**/*.c"

jobs:
  # 1단계: 리포에서 .ino 파일 위치를 자동 감지해 빌드 매트릭스 생성
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          DEVICES=$(find . -name "*.ino" -not -path "*/.git/*" \
            | xargs -I{} dirname {} \
            | sed 's|^\./||' \
            | sort -u \
            | jq -R . | jq -sc .)
          echo "matrix=$DEVICES" >> $GITHUB_OUTPUT
          echo "발견된 장치: $DEVICES"

  # 2단계: 장치별 병렬 빌드 + 배포
  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 board
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          git clone --depth 1 https://github.com/me-no-dev/AsyncTCP \
            ~/Arduino/libraries/AsyncTCP
          git clone --depth 1 https://github.com/me-no-dev/ESPAsyncWebServer \
            ~/Arduino/libraries/ESPAsyncWebServer

      - name: Extract version
        id: extract-version
        run: |
          DEVICE_DIR="${{ matrix.device }}"

          # config.h에서 FIRMWARE_VERSION 추출
          VERSION=$(grep -oP '#define\s+FIRMWARE_VERSION\s+"\K[^"]+' "${DEVICE_DIR}/config.h" || true)

          # major.minor 형식으로 정규화 (1.0.2 → 1.0 / 1.0 → 1.0)
          if [ -n "$VERSION" ]; then
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            if echo "$MAJOR" | grep -qE '^[0-9]+$' && echo "$MINOR" | grep -qE '^[0-9]+$'; then
              VERSION="${MAJOR}.${MINOR}"
            else
              VERSION=""
            fi
          fi

          # 버전을 감지 못하면 빌드 실패
          if [ -z "$VERSION" ]; then
            echo "::error::버전을 감지하지 못했습니다. ${DEVICE_DIR}/version.txt 또는 ${DEVICE_DIR}/config.h에 FIRMWARE_VERSION을 정의하세요."
            exit 1
          fi

          echo "감지된 버전: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: |
          mkdir -p build
          SKETCH=$(find ./${{ matrix.device }} -name "*.ino" | head -1)
          echo "빌드: $SKETCH (v${{ steps.extract-version.outputs.version }})"
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc" \
            "$SKETCH" \
            --output-dir ./build

      - name: Get signed upload URL
        id: get-url
        env:
          FIRMWARE_CI_TOKEN: ${{ secrets.FIRMWARE_CI_TOKEN }}
        run: |
          VERSION="${{ steps.extract-version.outputs.version }}"
          FILENAME="firmware-v${VERSION}.bin"
          RESPONSE=$(curl -sf -X POST \
            https://mystic-lab.vercel.app/api/admin/firmware/upload-url \
            -H "Authorization: Bearer ${FIRMWARE_CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"device_type\":\"${{ matrix.device }}\",\"version\":\"${VERSION}\",\"filename\":\"${FILENAME}\"}")
          echo "signed_url=$(echo "$RESPONSE" | jq -r '.signedUrl')" >> "$GITHUB_OUTPUT"
          echo "storage_path=$(echo "$RESPONSE" | jq -r '.storagePath')" >> "$GITHUB_OUTPUT"
          echo "public_url=$(echo "$RESPONSE" | jq -r '.publicUrl')" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload binary
        run: |
          BIN=$(find ./build -name "*.bin" | head -1)
          echo "업로드: $BIN ($(stat -c%s "$BIN") bytes)"
          curl -sf -X PUT "${{ steps.get-url.outputs.signed_url }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${BIN}"

      - name: Register release
        env:
          FIRMWARE_CI_TOKEN: ${{ secrets.FIRMWARE_CI_TOKEN }}
        run: |
          BIN=$(find ./build -name "*.bin" | head -1)
          FILE_SIZE=$(stat -c%s "$BIN")
          MSG="${{ github.event.head_commit.message }}"
          curl -sf -X POST \
            https://mystic-lab.vercel.app/api/admin/firmware \
            -H "Authorization: Bearer ${FIRMWARE_CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"device_type\": \"${{ matrix.device }}\",
              \"version\": \"${{ steps.get-url.outputs.version }}\",
              \"download_url\": \"${{ steps.get-url.outputs.public_url }}\",
              \"storage_path\": \"${{ steps.get-url.outputs.storage_path }}\",
              \"file_size\": ${FILE_SIZE},
              \"notes\": \"${GITHUB_SHA:0:8}: ${MSG}\"
            }"
          echo "✅ ${{ matrix.device }} v${{ steps.get-url.outputs.version }} 배포 완료"
